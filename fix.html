<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Clevedon Brewery & Tap Bar</title><style>html,body{margin:0;padding:0;width:100%;min-height:100%;background:#c82020}#app{min-height:100vh}.fix-error{font:16px Arial;padding:30px}</style></head><body><div id="app"></div><script>(async()=>{try{const r=await fetch('/index.html?source=static',{cache:'no-store'});const t=await r.text();const d=new DOMParser().parseFromString(t,'text/html');d.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));const main=d.querySelector('main');if(!main)throw new Error('main not found');const bs=main.querySelector('img[alt="Clevedon Brewery BS21 artwork"]');if(bs)bs.src='/assets/bs21.svg?v=11';document.getElementById('app').appendChild(main);document.title=d.title||document.title}catch(e){document.getElementById('app').innerHTML='<div class="fix-error">Unable to load the brewery page.</div>';console.error(e)}})();</script></body></html>
